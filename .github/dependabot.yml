version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major upgrades require an explicit compatibility review.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

      # These versions model the minimum supported VS Code 1.86 runtime.
      - dependency-name: "@types/vscode"
      - dependency-name: "@types/node"
        versions:
          - ">=19"

      # Mocha 11+ is not compatible with the VS Code 1.86 integration runtime.
      - dependency-name: "mocha"
        versions:
          - ">=11"
