name: Diagnose strict catch errors

on:
  push:
    branches:
      - refactor/strict-error-handling

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Enable strict catch variables
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tsconfig.json')
          text = p.read_text()
          text = text.replace('    "useUnknownInCatchVariables": false,\n', '')
          text = text.replace('    "useUnknownInCatchVariables": false,\r\n', '')
          p.write_text(text)
          PY
      - name: Compile
        run: yarn test-compile
