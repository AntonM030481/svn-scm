name: Format staging files

on:
  push:
    branches:
      - feature/git-like-staging
    paths:
      - .github/workflows/format-staging-files.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/git-like-staging
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn prettier --write src/stagingCoordinator.ts src/test/staging.test.ts
      - name: Commit formatting and remove helper workflow
        run: |
          rm .github/workflows/format-staging-files.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/stagingCoordinator.ts src/test/staging.test.ts .github/workflows/format-staging-files.yml
          git commit -m "style: format staging implementation"
          git push origin HEAD:feature/git-like-staging
