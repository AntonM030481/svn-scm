name: Replace original-fs

on:
  push:
    branches:
      - chore/use-node-fs
    paths:
      - .github/workflows/scan-original-fs.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/use-node-fs

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable
      - run: yarn install --immutable

      - name: Replace original-fs with Node fs APIs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const nodeFsFiles = [
            'src/tools/generateConfigSectionForReadme.ts',
            'src/source_control_manager.ts',
            'src/watchers/repositoryFilesWatcher.ts',
            'src/test/commands.test.ts',
            'src/test/repository.test.ts',
            'src/test/startupFileHistory.test.ts',
            'src/test/repositoryFilesWatcher.test.ts',
            'src/test/testUtil.ts'
          ];

          for (const file of nodeFsFiles) {
            let text = fs.readFileSync(file, 'utf8');
            text = text.replaceAll('"original-fs"', '"node:fs"');
            fs.writeFileSync(file, text);
          }

          let manager = fs.readFileSync('src/source_control_manager.ts', 'utf8');
          manager = manager.replace(
            'import { Stats } from "node:fs";',
            'import type { Stats } from "node:fs";'
          );
          fs.writeFileSync('src/source_control_manager.ts', manager);

          let watcher = fs.readFileSync('src/watchers/repositoryFilesWatcher.ts', 'utf8');
          watcher = watcher.replace(
            'import { statSync } from "node:fs";\nimport { watch } from "fs";',
            'import { statSync, watch } from "node:fs";'
          );
          fs.writeFileSync('src/watchers/repositoryFilesWatcher.ts', watcher);

          const promiseExports = {
            'src/fs/read_file.ts': 'readFile',
            'src/fs/write_file.ts': 'writeFile',
            'src/fs/readdir.ts': 'readdir',
            'src/fs/stat.ts': 'stat',
            'src/fs/unlink.ts': 'unlink',
            'src/fs/lstat.ts': 'lstat',
            'src/fs/mkdir.ts': 'mkdir',
            'src/fs/rmdir.ts': 'rmdir'
          };

          for (const [file, name] of Object.entries(promiseExports)) {
            fs.writeFileSync(file, `export { ${name} } from "node:fs/promises";\n`);
          }

          fs.writeFileSync(
            'src/fs/access.ts',
            `import { access as fsAccess } from "node:fs/promises";\n\nexport async function access(\n  path: string,\n  mode: number | undefined\n): Promise<boolean> {\n  try {\n    await fsAccess(path, mode);\n    return true;\n  } catch {\n    return false;\n  }\n}\n`
          );

          fs.writeFileSync(
            'src/fs/exists.ts',
            `import { access } from "node:fs/promises";\n\nexport async function exists(path: string): Promise<boolean> {\n  try {\n    await access(path);\n    return true;\n  } catch {\n    return false;\n  }\n}\n`
          );

          fs.rmSync('src/types/original-fs.d.ts');
          NODE

      - run: yarn remove original-fs

      - name: Verify no original-fs references remain
        shell: bash
        run: |
          if git grep -n 'original-fs' -- ':!.github/workflows/scan-original-fs.yml'; then
            echo 'original-fs references remain'
            exit 1
          fi

      - run: yarn check
      - run: yarn test:unit
      - run: yarn build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock src
          git commit -m "chore: use Node fs APIs"
          git push
