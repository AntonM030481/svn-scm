name: Fix staging full status test

on:
  push:
    paths:
      - .github/workflows/fix-staging-full-status-test.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/git-like-staging
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Fix test and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/test/staging.test.ts')
          s = p.read_text()
          old = '    fs.writeFileSync(second, "second\\n");\n    await repository.status();\n    const secondResource = repository.unversioned.resourceStates.find('
          new = '    fs.writeFileSync(second, "second\\n");\n    await repository.fullStatus();\n    const secondResource = repository.unversioned.resourceStates.find('
          if old not in s:
              raise SystemExit('target staging test sequence not found')
          p.write_text(s.replace(old, new, 1))
          PY
          yarn prettier --write src/test/staging.test.ts
          yarn check
      - name: Commit and remove helper
        shell: bash
        run: |
          rm .github/workflows/fix-staging-full-status-test.yml
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git add src/test/staging.test.ts .github/workflows/fix-staging-full-status-test.yml
          git commit -m "test: wait for full status before later staging"
          git push origin HEAD:feature/git-like-staging
