name: Format staging live validation test

on:
  push:
    paths:
      - .github/workflows/format-staging-live-validation.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/git-like-staging
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Format and commit
        shell: bash
        run: |
          yarn prettier --write src/test/stagingLiveValidation.test.ts
          rm .github/workflows/format-staging-live-validation.yml
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git add src/test/stagingLiveValidation.test.ts .github/workflows/format-staging-live-validation.yml
          git commit -m "style: format staging live validation tests"
          git push origin HEAD:feature/git-like-staging
