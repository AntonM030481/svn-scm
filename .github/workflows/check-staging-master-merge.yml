name: Sync staging branch with master

on:
  push:
    paths:
      - .github/workflows/check-staging-master-merge.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/git-like-staging
          fetch-depth: 0
      - name: Merge master and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git fetch origin master
          git merge --no-ff origin/master -m "chore: sync staging with master"
          git rm .github/workflows/check-staging-master-merge.yml
          git commit -m "chore: remove staging merge helper"
          git push origin HEAD:feature/git-like-staging
