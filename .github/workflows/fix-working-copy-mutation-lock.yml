name: Apply working-copy mutation lock

on:
  push:
    branches:
      - fix/block-staging-during-wc-mutation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/block-staging-during-wc-mutation
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Apply lock implementation
        run: python tools/apply-working-copy-mutation-lock.py
      - name: Validate
        run: |
          yarn prettier --write src/workingCopyMutationLock.ts src/repository.ts src/commands/stage.ts src/test/stagingSharedWorkingCopyGuard.test.ts src/test/workingCopyMutationLock.test.ts
          yarn check
          yarn test:unit
          yarn test-compile
      - name: Commit and remove helpers
        run: |
          rm .github/workflows/fix-working-copy-mutation-lock.yml
          rm tools/apply-working-copy-mutation-lock.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: serialize shared working-copy mutations"
          git push origin HEAD:fix/block-staging-during-wc-mutation
