name: Temporary repository discovery optimization

on:
  push:
    branches:
      - "perf/filter-repository-discovery-events"
    paths:
      - ".github/workflows/temp-repo-discovery.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: perf/filter-repository-discovery-events
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: python .github/temp_patch_repo_discovery.py
      - run: yarn check
      - run: yarn test:unit
      - run: yarn build
      - name: Commit changes
        run: |
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git add src/source_control_manager.ts
          git commit -m "perf: filter repository discovery events"
          git push origin HEAD:perf/filter-repository-discovery-events
