name: Temporary runtime refresh audit

on:
  push:
    branches:
      - "audit/runtime-refresh"
    paths:
      - ".github/workflows/temp-runtime-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Find routing and refresh call sites
        run: |
          echo '=== getRepositoryFromUri ==='
          rg -n 'getRepositoryFromUri' src || true
          echo '=== onDidChangeRepository ==='
          rg -n 'onDidChangeRepository' src || true
          echo '=== updateInfo ==='
          rg -n '\.updateInfo\(' src || true
          echo '=== eventuallyUpdateWhenIdleAndWait ==='
          rg -n 'eventuallyUpdateWhenIdleAndWait' src || true
          echo '=== notifyRepositoryChanged ==='
          rg -n 'notifyRepositoryChanged' src || true
