name: Temporary runtime refresh audit

on:
  push:
    branches:
      - "audit/runtime-refresh"
    paths:
      - ".github/workflows/temp-runtime-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Find cached repository info reads
        run: |
          echo '=== repository.info ==='
          grep -RFn 'repository.info' src || true
          echo '=== this.info ==='
          grep -RFn 'this.info' src || true
          echo '=== .info.revision ==='
          grep -RFn '.info.revision' src || true
          echo '=== .info.url ==='
          grep -RFn '.info.url' src || true
