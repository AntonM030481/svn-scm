name: Temporary targeted root info optimization

on:
  push:
    branches:
      - "perf/avoid-extra-info"
    paths:
      - ".github/workflows/temp-root-info.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: perf/avoid-extra-info
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Remove redundant root info refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/incrementalStatus.ts')
          lines = source.read_text().splitlines()
          info_index = next(i for i, line in enumerate(lines) if 'await svnRepository.updateInfo();' in line)
          expected = [
              '          try {',
              '            await svnRepository.updateInfo();',
              '          } catch (error) {',
              '            console.error(error);',
              '          }',
          ]
          if lines[info_index - 1:info_index + 4] != expected:
              raise SystemExit('unexpected root info block')
          del lines[info_index - 1:info_index + 4]
          source.write_text('\n'.join(lines) + '\n')

          test = Path('src/test/repository.test.ts')
          lines = test.read_text().splitlines()
          listener_index = next(i for i, line in enumerate(lines) if line.strip() == 'let repositoryChangeEvents = 0;')
          instrumentation = [
              '    const svnRepository = repository.repository;',
              '    const originalUpdateInfo = svnRepository.updateInfo.bind(svnRepository);',
              '    let updateInfoCalls = 0;',
              '    svnRepository.updateInfo = async () => {',
              '      updateInfoCalls += 1;',
              '      return originalUpdateInfo();',
              '    };',
              '',
          ]
          lines[listener_index:listener_index] = instrumentation

          event_assert_index = next(i for i, line in enumerate(lines) if line.strip() == 'assert.equal(repositoryChangeEvents, 1);')
          lines.insert(event_assert_index, '      assert.equal(updateInfoCalls, 0);')

          cleanup_index = next(i for i, line in enumerate(lines) if line.strip() == 'repositoryChangeListener.dispose();')
          lines.insert(cleanup_index, '      svnRepository.updateInfo = originalUpdateInfo;')
          test.write_text('\n'.join(lines) + '\n')
          PY
          yarn style-fix
      - run: yarn check
      - run: yarn test:unit
      - run: yarn build
      - name: Commit changes
        run: |
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git add src/incrementalStatus.ts src/test/repository.test.ts
          git commit -m "perf: skip root info after targeted operations"
          git push origin HEAD:perf/avoid-extra-info
