name: Temporary targeted root info optimization

on:
  push:
    branches:
      - "perf/avoid-extra-info"
    paths:
      - ".github/workflows/temp-root-info.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: perf/avoid-extra-info
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Remove redundant root info refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/incrementalStatus.ts')
          text = source.read_text()
          old = '''        if (succeeded && targets) {
            try {
              await svnRepository.updateInfo();
            } catch (error) {
              console.error(error);
            }
            repository.notifyRepositoryChanged(Uri.file(repository.root));
          }'''
          new = '''        if (succeeded && targets) {
            repository.notifyRepositoryChanged(Uri.file(repository.root));
          }'''
          if old not in text:
              raise SystemExit('incremental status block not found')
          source.write_text(text.replace(old, new, 1))

          test = Path('src/test/repository.test.ts')
          text = test.read_text()
          anchor = '''    let repositoryChangeEvents = 0;
            const repositoryChangeListener = sourceControlManager.onDidChangeRepository('''
          replacement = '''    const svnRepository = repository.repository;
            const originalUpdateInfo = svnRepository.updateInfo.bind(svnRepository);
            let updateInfoCalls = 0;
            svnRepository.updateInfo = async () => {
              updateInfoCalls += 1;
              return originalUpdateInfo();
            };

            let repositoryChangeEvents = 0;
            const repositoryChangeListener = sourceControlManager.onDidChangeRepository('''
          if anchor not in text:
              raise SystemExit('commit test listener anchor not found')
          text = text.replace(anchor, replacement, 1)
          anchor = '''      assert.equal(repository.changes.resourceStates.length, 0);
              assert.equal(repositoryChangeEvents, 1);'''
          replacement = '''      assert.equal(repository.changes.resourceStates.length, 0);
              assert.equal(updateInfoCalls, 0);
              assert.equal(repositoryChangeEvents, 1);'''
          if anchor not in text:
              raise SystemExit('commit test assertion anchor not found')
          text = text.replace(anchor, replacement, 1)
          anchor = '''    } finally {
              repositoryChangeListener.dispose();
            }
          });'''
          replacement = '''    } finally {
              svnRepository.updateInfo = originalUpdateInfo;
              repositoryChangeListener.dispose();
            }
          });'''
          if anchor not in text:
              raise SystemExit('commit test cleanup anchor not found')
          test.write_text(text.replace(anchor, replacement, 1))
          PY
          yarn style-fix
      - run: yarn check
      - run: yarn test:unit
      - run: yarn build
      - name: Commit changes
        run: |
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git add src/incrementalStatus.ts src/test/repository.test.ts
          git commit -m "perf: skip root info after targeted operations"
          git push origin HEAD:perf/avoid-extra-info
