name: Temporary deferred callback audit

on:
  push:
    branches:
      - "audit/deferred-callbacks"
    paths:
      - ".github/workflows/temp-deferred-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Find deferred callbacks
        run: |
          echo '=== debounce decorators ==='
          grep -RFn '@debounce' src || true
          echo '=== setTimeout ==='
          grep -RFn 'setTimeout(' src || true
          echo '=== setInterval ==='
          grep -RFn 'setInterval(' src || true
          echo '=== clearTimeout ==='
          grep -RFn 'clearTimeout(' src || true
          echo '=== clearInterval ==='
          grep -RFn 'clearInterval(' src || true
