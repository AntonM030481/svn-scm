name: Apply staging projection review fixes

on:
  push:
    paths:
      - .github/workflows/apply-staging-final-review-6.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/git-like-staging
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --immutable
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path

          repository_file = Path('src/repository.ts')
          text = repository_file.read_text()
          old = '''  private _onDidChangeStatus = new EventEmitter<void>();\n  public readonly onDidChangeStatus: Event<void> =\n    this._onDidChangeStatus.event;\n\n  private _onDidChangeRemoteChangedFiles = new EventEmitter<void>();'''
          new = '''  private _onDidChangeStatus = new EventEmitter<void>();\n  public readonly onDidChangeStatus: Event<void> =\n    this._onDidChangeStatus.event;\n\n  private _onDidRebuildStatusProjection = new EventEmitter<void>();\n  public readonly onDidRebuildStatusProjection: Event<void> =\n    this._onDidRebuildStatusProjection.event;\n\n  private _onDidChangeRemoteChangedFiles = new EventEmitter<void>();'''
          if old not in text:
              raise SystemExit('repository event anchor not found')
          text = text.replace(old, new, 1)
          old = '''    if (preview) {\n      this.sourceControl.quickDiffProvider = this;\n    } else if (publishStatus) {'''
          new = '''    this._onDidRebuildStatusProjection.fire();\n\n    if (preview) {\n      this.sourceControl.quickDiffProvider = this;\n    } else if (publishStatus) {'''
          if old not in text:
              raise SystemExit('projection fire anchor not found')
          text = text.replace(old, new, 1)
          repository_file.write_text(text)

          coordinator_file = Path('src/stagingCoordinator.ts')
          text = coordinator_file.read_text()
          old = '      repository.onDidChangeStatus(() => this.reconcile(repository))'
          new = '      repository.onDidRebuildStatusProjection(() => this.reconcile(repository))'
          if old not in text:
              raise SystemExit('staging listener anchor not found')
          text = text.replace(old, new, 1)

          current_anchor = '''  private currentChangelist(\n    repository: Repository,\n    resource: Resource\n  ): string | undefined {'''
          if current_anchor not in text:
              raise SystemExit('currentChangelist anchor not found')
          helper = '''  private createdDirectoryRelativeRootForPath(\n    repository: Repository,\n    filePath: string\n  ): string | undefined {\n    const changelists = new Set<string>([\n      ...(this.states.get(repository)?.metadataByPath.values() ?? []),\n      ...repository.stagedChangelists.values()\n    ]);\n    let best: { relative: string; absolute: string } | undefined;\n\n    for (const changelist of changelists) {\n      const relative = parseStagingChangelist(\n        changelist\n      )?.createdDirectoryRelativeRoot;\n      if (!relative) continue;\n\n      const absolute = path.resolve(repository.root, relative);\n      if (\n        !isPathInside(repository.root, absolute) ||\n        !isPathInside(absolute, filePath)\n      ) {\n        continue;\n      }\n\n      if (!best || normalizePath(absolute).length > normalizePath(best.absolute).length) {\n        best = { relative, absolute };\n      }\n    }\n\n    return best?.relative;\n  }\n\n'''
          text = text.replace(current_anchor, helper + current_anchor, 1)

          old = '''      if (files.length) {\n        await repository.addFiles(files);\n        await repository.addChangelist(\n          files,\n          createStagingChangelist(undefined, true)\n        );\n      }'''
          new = '''      if (files.length) {\n        const byDestination = new Map<string, string[]>();\n        for (const file of files) {\n          const destination = createStagingChangelist(\n            undefined,\n            true,\n            this.createdDirectoryRelativeRootForPath(repository, file)\n          );\n          const paths = byDestination.get(destination) ?? [];\n          paths.push(file);\n          byDestination.set(destination, paths);\n        }\n\n        await repository.addFiles(files);\n        for (const [destination, paths] of byDestination) {\n          await repository.addChangelist(paths, destination);\n        }\n      }'''
          if old not in text:
              raise SystemExit('unversioned files staging anchor not found')
          text = text.replace(old, new, 1)
          coordinator_file.write_text(text)

          tests = Path('src/test/staging.test.ts')
          text = tests.read_text()
          import_anchor = 'import { Repository } from "../repository";'
          if 'import { IFileStatus } from "../common/types";' not in text:
              text = text.replace(import_anchor, 'import { IFileStatus } from "../common/types";\n' + import_anchor, 1)

          anchor = '  test("staged files survive sequential targeted staging operations", async () => {'
          projection_test = '''  test("reserved staging groups are reconciled on nonpublishing projection rebuilds", async () => {\n    const checkout = await createCheckoutWithFiles();\n    await sourceControlManager.tryOpenRepository(checkout.fsPath);\n    const repository = sourceControlManager.getRepository(\n      checkout\n    ) as Repository;\n    opened.push(repository);\n\n    const file = path.join(checkout.fsPath, "one", "a.txt");\n    fs.writeFileSync(file, "a1\\n");\n    await repository.status();\n    const resource = repository.changes.resourceStates.find(\n      item => item.resourceUri.fsPath === file\n    );\n    assert.ok(resource);\n    await commands.executeCommand("svn.stage", resource);\n\n    const statuses = await repository.repository.getStatus({\n      includeIgnored: true,\n      includeExternals: false,\n      forceFull: true\n    });\n    const projection = repository as unknown as {\n      applyStatus(\n        statuses: IFileStatus[],\n        checkRemoteChanges: boolean,\n        preview?: boolean,\n        publishStatus?: boolean\n      ): void;\n    };\n    projection.applyStatus(statuses, false, true, false);\n\n    const reserved = repository.changelists.get(createStagingChangelist());\n    assert.equal(reserved?.resourceStates.length ?? 0, 0);\n    assert.equal(\n      repository.staged?.resourceStates.some(\n        item => item.resourceUri.fsPath === file\n      ),\n      true\n    );\n  });\n\n'''
          if anchor not in text:
              raise SystemExit('projection test insertion anchor not found')
          text = text.replace(anchor, projection_test + anchor, 1)

          anchor = '  test("unstaging an unversioned folder restores its scheduled additions", async () => {'
          inherit_test = '''  test("later files inherit a staging-created directory root", async () => {\n    const checkout = await createCheckoutWithFiles();\n    await sourceControlManager.tryOpenRepository(checkout.fsPath);\n    const repository = sourceControlManager.getRepository(\n      checkout\n    ) as Repository;\n    opened.push(repository);\n\n    const directory = path.join(checkout.fsPath, "inherited-root");\n    const first = path.join(directory, "first.txt");\n    const second = path.join(directory, "second.txt");\n    fs.mkdirSync(directory);\n    fs.writeFileSync(first, "first\\n");\n    await repository.status();\n\n    const folder = repository.unversioned.resourceStates.find(\n      item => item.resourceUri.fsPath === directory\n    );\n    assert.ok(folder);\n    await commands.executeCommand("svn.stage", folder);\n\n    fs.writeFileSync(second, "second\\n");\n    await repository.status();\n    const secondResource = repository.unversioned.resourceStates.find(\n      item => item.resourceUri.fsPath === second\n    );\n    assert.ok(secondResource);\n    await commands.executeCommand("svn.stage", secondResource);\n\n    const relativeRoot = path.relative(repository.root, directory);\n    assert.equal(\n      parseStagingChangelist(\n        repository.stagedChangelists.get(path.resolve(second)) ?? ""\n      )?.createdDirectoryRelativeRoot,\n      relativeRoot\n    );\n\n    const firstStaged = repository.staged?.resourceStates.find(\n      item => item.resourceUri.fsPath === first\n    );\n    const secondStaged = repository.staged?.resourceStates.find(\n      item => item.resourceUri.fsPath === second\n    );\n    assert.ok(firstStaged);\n    assert.ok(secondStaged);\n    await commands.executeCommand("svn.unstage", firstStaged);\n    await commands.executeCommand("svn.unstage", secondStaged);\n\n    const status = svn(["status"], checkout.fsPath);\n    assert.doesNotMatch(status, /^A\\s+inherited-root$/m);\n    assert.match(status, /^\\?\\s+inherited-root$/m);\n  });\n\n'''
          if anchor not in text:
              raise SystemExit('inherit test insertion anchor not found')
          text = text.replace(anchor, inherit_test + anchor, 1)
          tests.write_text(text)

          docs = Path('docs/staging.md')
          text = docs.read_text()
          old = 'Reserved changelists are projected into `Staged Changes` after every completed status.'
          new = 'Reserved changelists are projected into `Staged Changes` after every SCM projection rebuild, including startup previews and display-only configuration rebuilds that intentionally do not publish a normal status event.'
          if old in text:
              text = text.replace(old, new, 1)
          docs.write_text(text)
      - name: Format and validate
        run: |
          yarn prettier --write src/repository.ts src/stagingCoordinator.ts src/test/staging.test.ts docs/staging.md
          yarn check
          yarn test:unit
      - name: Commit fixes and remove helper
        run: |
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git add src/repository.ts src/stagingCoordinator.ts src/test/staging.test.ts docs/staging.md
          git rm .github/workflows/apply-staging-final-review-6.yml
          git commit -m "fix: reconcile staging on every projection rebuild"
          git push origin HEAD:feature/git-like-staging
