name: Add ASAR regression test

on:
  push:
    branches:
      - test/asar-physical-fs
    paths:
      - .github/workflows/add-asar-regression-test.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/asar-physical-fs

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn add -D @electron/asar@3.2.10

      - name: Add ASAR regression test
        shell: bash
        run: |
          cat > src/test/asarPhysicalFs.test.ts <<'EOF'
          import * as assert from "assert";
          import * as fs from "node:fs";
          import * as os from "node:os";
          import * as path from "node:path";
          import { createPackage } from "@electron/asar";
          import { readdir, stat } from "../fs";

          suite("Physical filesystem ASAR handling", () => {
            test("treats .asar archives as physical files", async () => {
              const root = fs.mkdtempSync(path.join(os.tmpdir(), "svn-scm-asar-"));
              const source = path.join(root, "source");
              const archive = path.join(root, "fixture.asar");
              const renamed = path.join(root, "fixture-renamed.asar");

              fs.mkdirSync(source);
              fs.writeFileSync(path.join(source, "payload.txt"), "payload");

              try {
                await createPackage(source, archive);

                const archiveStat = await stat(archive);
                assert.equal(archiveStat.isFile(), true);
                assert.equal(archiveStat.isDirectory(), false);

                await assert.rejects(
                  () => readdir(archive),
                  (error: NodeJS.ErrnoException) => error.code === "ENOTDIR"
                );

                fs.renameSync(archive, renamed);
                assert.equal(fs.statSync(renamed).isFile(), true);
              } finally {
                fs.rmSync(root, { recursive: true, force: true });
              }
            });
          });
          EOF

      - run: yarn check
      - run: yarn test:unit
      - run: yarn build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock src/test/asarPhysicalFs.test.ts
          git commit -m "test: cover physical ASAR filesystem behavior"
          git push
