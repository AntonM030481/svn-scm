name: CI

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compile tests
        run: yarn test-compile

      - name: Run unit tests
        run: yarn test:unit

      - name: Package extension
        run: yarn vsce package -o svn-scm.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v6
        with:
          name: svn-scm-${{ github.sha }}
          path: svn-scm.vsix

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Subversion
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install Subversion
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "sliksvn.zip"
          $destination = Join-Path $env:RUNNER_TEMP "sliksvn"
          Invoke-WebRequest -Uri "https://sliksvn.com/download/slik-subversion-1-14-5-x64/" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination

          $installer = Get-ChildItem -Path $destination -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $installer) {
            throw "SlikSVN installer was not found in the archive"
          }

          $process = Start-Process msiexec.exe -ArgumentList "/i", $installer.FullName, "/qn", "/norestart" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "SlikSVN installer failed with exit code $($process.ExitCode)"
          }

          $svnDirectory = Join-Path $env:ProgramFiles "SlikSvn\\bin"
          $svn = Join-Path $svnDirectory "svn.exe"
          if (-not (Test-Path $svn)) {
            throw "svn.exe was not found after installing SlikSVN"
          }

          $svnDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $svn --version --quiet

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compile tests
        run: yarn test-compile

      - name: Run integration tests
        if: runner.os == 'Linux'
        run: xvfb-run -a yarn test:integration
        env:
          CODE_VERSION: stable

      - name: Run integration tests
        if: runner.os == 'Windows'
        run: yarn test:integration
        env:
          CODE_VERSION: stable
