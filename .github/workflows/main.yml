name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: Format
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Format TypeScript
        run: yarn style-fix

      - name: Commit formatting
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- src; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Apply automatic formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run CI for formatted head
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main.yml --ref "${{ github.event.pull_request.head.ref }}"

  build:
    needs: format
    if: >-
      always() &&
      (needs.format.result == 'skipped' ||
       (needs.format.result == 'success' && needs.format.outputs.changed != 'true'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check
        run: yarn check

      - name: Run unit tests
        run: yarn test:unit

      - name: Test release tooling
        run: node --test scripts/*.test.cjs

      - name: Package extension
        run: yarn vsce package --no-yarn -o svn-scm.vsix

      - name: Check package budgets
        run: node scripts/check-package-size.cjs svn-scm.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: svn-scm-${{ github.sha }}
          path: svn-scm.vsix

  test:
    needs: format
    if: >-
      always() &&
      (needs.format.result == 'skipped' ||
       (needs.format.result == 'success' && needs.format.outputs.changed != 'true'))
    name: Test (${{ matrix.os }}, VS Code ${{ matrix.vscode-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode-version: 1.86.0
          - os: ubuntu-latest
            vscode-version: stable
          - os: windows-latest
            vscode-version: 1.86.0
          - os: windows-latest
            vscode-version: stable
          # VS Code 1.86's Electron crashes on current GitHub macOS images
          # before extension tests start. Minimum-version coverage remains on Linux and Windows.
          - os: macos-latest
            vscode-version: stable

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Cache minimum VS Code test runtime
        if: matrix.vscode-version != 'stable'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ matrix.vscode-version }}-v1

      - name: Enable Corepack
        run: corepack enable

      - name: Install Subversion
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install Subversion
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "sliksvn.zip"
          $destination = Join-Path $env:RUNNER_TEMP "sliksvn"
          Invoke-WebRequest -Uri "https://sliksvn.com/download/slik-subversion-1-14-5-x64/" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination

          $installer = Get-ChildItem -Path $destination -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $installer) {
            throw "SlikSVN installer was not found in the archive"
          }

          $process = Start-Process msiexec.exe -ArgumentList "/i", $installer.FullName, "/qn", "/norestart" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "SlikSVN installer failed with exit code $($process.ExitCode)"
          }

          $svnDirectory = Join-Path $env:ProgramFiles "SlikSvn\\bin"
          $svn = Join-Path $svnDirectory "svn.exe"
          if (-not (Test-Path $svn)) {
            throw "svn.exe was not found after installing SlikSVN"
          }

          $svnDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $svn --version --quiet

      - name: Install Subversion
        if: runner.os == 'macOS'
        run: |
          if ! command -v svn >/dev/null 2>&1; then
            brew install subversion
          fi
          svn --version --quiet

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compile tests
        run: yarn test-compile

      - name: Run integration tests
        if: runner.os == 'Linux'
        run: xvfb-run -a yarn test:integration
        env:
          CODE_VERSION: ${{ matrix.vscode-version }}

      - name: Run integration tests
        if: runner.os != 'Linux'
        run: yarn test:integration
        env:
          CODE_VERSION: ${{ matrix.vscode-version }}
