name: CI

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check
        run: yarn check

      - name: Run unit tests
        run: yarn test:unit

      - name: Package extension
        run: yarn vsce package --no-yarn -o svn-scm.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: svn-scm-${{ github.sha }}
          path: svn-scm.vsix

  test:
    name: Test (${{ matrix.os }}, VS Code ${{ matrix.vscode-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        vscode-version:
          - 1.86.0
          - stable

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Subversion
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install Subversion
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "sliksvn.zip"
          $destination = Join-Path $env:RUNNER_TEMP "sliksvn"
          Invoke-WebRequest -Uri "https://sliksvn.com/download/slik-subversion-1-14-5-x64/" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination

          $installer = Get-ChildItem -Path $destination -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $installer) {
            throw "SlikSVN installer was not found in the archive"
          }

          $process = Start-Process msiexec.exe -ArgumentList "/i", $installer.FullName, "/qn", "/norestart" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "SlikSVN installer failed with exit code $($process.ExitCode)"
          }

          $svnDirectory = Join-Path $env:ProgramFiles "SlikSvn\\bin"
          $svn = Join-Path $svnDirectory "svn.exe"
          if (-not (Test-Path $svn)) {
            throw "svn.exe was not found after installing SlikSVN"
          }

          $svnDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $svn --version --quiet

      - name: Install Subversion
        if: runner.os == 'macOS'
        run: |
          if ! command -v svn >/dev/null 2>&1; then
            brew install subversion
          fi
          svn --version --quiet

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compile tests
        run: yarn test-compile

      - name: Run integration tests
        if: runner.os == 'Linux'
        run: xvfb-run -a yarn test:integration
        env:
          CODE_VERSION: ${{ matrix.vscode-version }}

      - name: Run integration tests
        if: runner.os != 'Linux'
        run: yarn test:integration
        env:
          CODE_VERSION: ${{ matrix.vscode-version }}
