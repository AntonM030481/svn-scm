name: Update build tooling

on:
  push:
    branches:
      - chore/modernize-build-tooling
    paths:
      - .github/workflows/update-build-tooling.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: chore/modernize-build-tooling

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Update dependencies
        run: yarn add -D @types/node@18 webpack-cli@7.2.3

      - name: Adapt code to Node 18 typings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/repository.ts")
          text = path.read_text()
          text = text.replace(
              "private remoteChangedUpdateInterval?: NodeJS.Timer;",
              "private remoteChangedUpdateInterval?: ReturnType<typeof setInterval>;",
          )
          path.write_text(text)

          path = Path("src/temp_svn_fs.ts")
          text = path.read_text()
          text = text.replace(
              "private _fireSoonHandler?: NodeJS.Timer;",
              "private _fireSoonHandler?: ReturnType<typeof setTimeout>;",
          )
          path.write_text(text)

          path = Path("src/svnRepository.ts")
          text = path.read_text()
          text = text.replace(
              'await writeFile(tmpFile.name, message, "UTF-8");',
              'await writeFile(tmpFile.name, message, "utf8");',
          )
          path.write_text(text)

          path = Path("src/watchers/repositoryFilesWatcher.ts")
          text = path.read_text()
          text = text.replace(
              'private repoWatch(event: string, filename: string): void {\n    if (event === "change") {',
              'private repoWatch(event: string, filename: string | null): void {\n    if (filename === null) {\n      return;\n    }\n\n    if (event === "change") {',
          )
          path.write_text(text)
          PY

      - name: Check
        run: yarn check

      - name: Unit tests
        run: yarn test:unit

      - name: Build
        run: yarn build

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock src/repository.ts src/temp_svn_fs.ts src/svnRepository.ts src/watchers/repositoryFilesWatcher.ts
          git commit -m "chore: modernize build tooling"
          git push
