name: Update build tooling

on:
  push:
    branches:
      - chore/modernize-build-tooling
    paths:
      - .github/workflows/update-build-tooling.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: chore/modernize-build-tooling

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Update dependencies
        run: yarn add -D @types/node@18 webpack-cli@7.2.3

      - name: Check
        run: yarn check

      - name: Unit tests
        run: yarn test:unit

      - name: Build
        run: yarn build

      - name: Commit generated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock
          git commit -m "chore: modernize build tooling"
          git push
