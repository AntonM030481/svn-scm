name: Update release workflow

on:
  push:
    branches:
      - chore/modernize-release-workflow
    paths:
      - .github/workflows/update-release-workflow.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: chore/modernize-release-workflow

      - name: Update package prepublish script
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          let text = fs.readFileSync(path, 'utf8');
          const from = '"vscode:prepublish": "yarn run lint && yarn run build"';
          const to = '"vscode:prepublish": "yarn check && yarn build"';
          if (!text.includes(from)) throw new Error('Expected vscode:prepublish script not found');
          text = text.replace(from, to);
          fs.writeFileSync(path, text);
          NODE

      - name: Update release workflow
        shell: bash
        run: |
          cat > .github/workflows/release.yml <<'YAML'
          name: Release

          on:
            push:
              tags:
                - "v*"

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest

              steps:
                - name: Checkout
                  uses: actions/checkout@v6

                - name: Setup Node
                  uses: actions/setup-node@v6
                  with:
                    node-version: 24

                - name: Enable Corepack
                  run: corepack enable

                - name: Install dependencies
                  run: yarn install --immutable

                - name: Verify tag matches package version
                  run: |
                    VERSION=$(node -p "require('./package.json').version")
                    test "v$VERSION" = "$GITHUB_REF_NAME" || {
                      echo "Tag $GITHUB_REF_NAME does not match package version $VERSION"
                      exit 1
                    }

                - name: Check
                  run: yarn check

                - name: Run unit tests
                  run: yarn test:unit

                - name: Package extension
                  run: yarn vsce package --no-yarn -o svn-scm-${{ github.ref_name }}.vsix

                - name: Upload VSIX
                  uses: actions/upload-artifact@v6
                  with:
                    name: release-vsix
                    path: svn-scm-${{ github.ref_name }}.vsix

            integration:
              needs: quality
              runs-on: ubuntu-latest

              strategy:
                fail-fast: false
                matrix:
                  vscode-version:
                    - 1.86.0
                    - stable

              steps:
                - name: Checkout
                  uses: actions/checkout@v6

                - name: Setup Node
                  uses: actions/setup-node@v6
                  with:
                    node-version: 24

                - name: Enable Corepack
                  run: corepack enable

                - name: Install Subversion
                  run: sudo apt-get update && sudo apt-get install -y subversion

                - name: Install dependencies
                  run: yarn install --immutable

                - name: Compile tests
                  run: yarn test-compile

                - name: Run integration tests
                  run: xvfb-run -a yarn test:integration
                  env:
                    CODE_VERSION: ${{ matrix.vscode-version }}

            release:
              needs:
                - quality
                - integration
              runs-on: ubuntu-latest
              permissions:
                contents: write

              steps:
                - name: Checkout
                  uses: actions/checkout@v6

                - name: Download VSIX
                  uses: actions/download-artifact@v7
                  with:
                    name: release-vsix
                    path: .

                - name: Prepare release notes
                  run: |
                    VERSION="${GITHUB_REF_NAME#v}"
                    awk -v version="$VERSION" '
                      $0 ~ "^#+ \\[" version "\\]" { found = 1; next }
                      found && /^#+ \[[0-9]+\.[0-9]+\.[0-9]+\]/ { exit }
                      found { print }
                      END { if (!found) exit 1 }
                    ' CHANGELOG.md > release-notes.md
                    test -s release-notes.md

                - name: Create GitHub release
                  run: |
                    gh release create "$GITHUB_REF_NAME" \
                      "svn-scm-$GITHUB_REF_NAME.vsix" \
                      --verify-tag \
                      --title "$GITHUB_REF_NAME" \
                      --notes-file release-notes.md
                  env:
                    GH_TOKEN: ${{ github.token }}
          YAML

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check
        run: yarn check

      - name: Unit tests
        run: yarn test:unit

      - name: Package extension
        run: yarn vsce package --no-yarn -o svn-scm.vsix

      - name: Verify workflow cleanup
        shell: bash
        run: |
          ! grep -q -- '--allow-star-activation' .github/workflows/release.yml
          ! grep -q '1.109.2' .github/workflows/release.yml
          grep -q 'CODE_VERSION:.*matrix.vscode-version' .github/workflows/release.yml
          grep -q '"vscode:prepublish": "yarn check && yarn build"' package.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .github/workflows/release.yml
          git commit -m "chore: modernize release validation"
          git push
