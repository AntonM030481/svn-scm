name: Fix stale added unstage
on:
  push:
    branches:
      - feature/git-like-staging
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/git-like-staging
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Apply fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/stagingCoordinator.ts')
          s = p.read_text()
          pattern = re.compile(
              r'    const addedPaths = resources\n'
              r'.*?'
              r'    await repository\.removeChangelist\(paths\);\n'
              r'    if \(metadata\.wasUnversioned && addedPaths\.length\) \{\n'
              r'      await repository\.revert\(addedPaths, "empty"\);\n'
              r'      for \(const directory of addedDirectories\) \{\n'
              r'        await repository\.revert\(\[directory\], "empty"\);\n'
              r'      \}\n'
              r'    \}\n',
              re.S,
          )
          replacement = '''    await repository.removeChangelist(paths);
          if (!metadata.wasUnversioned) return;

          const selected = new Set(paths.map(normalizePath));
          const statuses = await repository.repository.getStatus({
            includeIgnored: true,
            includeExternals: false,
            forceFull: true
          });
          const addedPaths = statuses
            .filter(status => status.status === Status.ADDED)
            .map(status =>
              path.isAbsolute(status.path)
                ? status.path
                : path.resolve(repository.workspaceRoot, status.path)
            )
            .filter(candidate => selected.has(normalizePath(candidate)));
          if (!addedPaths.length) return;

          const addedDirectories = metadata.createdDirectoryRelativeRoot
            ? await this.addedAncestorDirectoriesForUnstage(
                repository,
                addedPaths,
                metadata.createdDirectoryRelativeRoot
              )
            : [];

          await repository.revert(addedPaths, "empty");
          for (const directory of addedDirectories) {
            await repository.revert([directory], "empty");
          }
'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'stagingCoordinator replacement count={count}')
          p.write_text(s)

          p = Path('src/test/stagingLiveValidation.test.ts')
          s = p.read_text()
          pattern = re.compile(
              r'    const originalEnsureStatus = repository\.ensureStatus\.bind\(repository\);\n'
              r'.*?'
              r'    \}\n\n'
              r'    assert\.equal',
              re.S,
          )
          replacement = '''    await commands.executeCommand("svn.unstage", staleStaged);

          assert.equal'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'live validation replacement count={count}')
          p.write_text(s)
          PY
          yarn prettier --write src/stagingCoordinator.ts src/test/stagingLiveValidation.test.ts
          yarn check
          yarn test:unit
      - name: Commit and remove helper
        run: |
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git add src/stagingCoordinator.ts src/test/stagingLiveValidation.test.ts
          git commit -m "fix: recheck staged additions before revert"
          git rm .github/workflows/fix-stale-added-unstage.yml
          git commit -m "chore: remove stale-added fix helper"
          git push origin HEAD:feature/git-like-staging
