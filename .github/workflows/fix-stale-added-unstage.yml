name: Fix stale added unstage
on:
  push:
    branches:
      - feature/git-like-staging
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/git-like-staging
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Apply fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/stagingCoordinator.ts')
          s = p.read_text()
          old = (
              '    const addedPaths = resources\n'
              '      .filter(resource => resource.type === Status.ADDED)\n'
              '      .map(resource => resource.resourceUri.fsPath);\n'
              '    const addedDirectories =\n'
              '      metadata.wasUnversioned &&\n'
              '      metadata.createdDirectoryRelativeRoot &&\n'
              '      addedPaths.length\n'
              '        ? await this.addedAncestorDirectoriesForUnstage(\n'
              '            repository,\n'
              '            addedPaths,\n'
              '            metadata.createdDirectoryRelativeRoot\n'
              '          )\n'
              '        : [];\n'
              '\n'
              '    await repository.removeChangelist(paths);\n'
              '    if (metadata.wasUnversioned && addedPaths.length) {\n'
              '      await repository.revert(addedPaths, "empty");\n'
              '      for (const directory of addedDirectories) {\n'
              '        await repository.revert([directory], "empty");\n'
              '      }\n'
              '    }\n'
          )
          new = (
              '    await repository.removeChangelist(paths);\n'
              '    if (!metadata.wasUnversioned) return;\n'
              '\n'
              '    const selected = new Set(paths.map(normalizePath));\n'
              '    const statuses = await repository.repository.getStatus({\n'
              '      includeIgnored: true,\n'
              '      includeExternals: false,\n'
              '      forceFull: true\n'
              '    });\n'
              '    const addedPaths = statuses\n'
              '      .filter(status => status.status === Status.ADDED)\n'
              '      .map(status =>\n'
              '        path.isAbsolute(status.path)\n'
              '          ? status.path\n'
              '          : path.resolve(repository.workspaceRoot, status.path)\n'
              '      )\n'
              '      .filter(candidate => selected.has(normalizePath(candidate)));\n'
              '    if (!addedPaths.length) return;\n'
              '\n'
              '    const addedDirectories = metadata.createdDirectoryRelativeRoot\n'
              '      ? await this.addedAncestorDirectoriesForUnstage(\n'
              '          repository,\n'
              '          addedPaths,\n'
              '          metadata.createdDirectoryRelativeRoot\n'
              '        )\n'
              '      : [];\n'
              '\n'
              '    await repository.revert(addedPaths, "empty");\n'
              '    for (const directory of addedDirectories) {\n'
              '      await repository.revert([directory], "empty");\n'
              '    }\n'
          )
          if old not in s:
              raise SystemExit('stagingCoordinator target block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/test/stagingLiveValidation.test.ts')
          s = p.read_text()
          old = (
              '    const originalEnsureStatus = repository.ensureStatus.bind(repository);\n'
              '    (repository as any).ensureStatus = async () => {\n'
              '      await repository.status();\n'
              '    };\n'
              '    try {\n'
              '      await commands.executeCommand("svn.unstage", staleStaged);\n'
              '    } finally {\n'
              '      (repository as any).ensureStatus = originalEnsureStatus;\n'
              '    }\n'
          )
          new = '    await commands.executeCommand("svn.unstage", staleStaged);\n'
          if old not in s:
              raise SystemExit('live validation target block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          yarn prettier --write src/stagingCoordinator.ts src/test/stagingLiveValidation.test.ts
          yarn check
          yarn test:unit
      - name: Commit and remove helper
        run: |
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git add src/stagingCoordinator.ts src/test/stagingLiveValidation.test.ts
          git commit -m "fix: recheck staged additions before revert"
          git rm .github/workflows/fix-stale-added-unstage.yml
          git commit -m "chore: remove stale-added fix helper"
          git push origin HEAD:feature/git-like-staging
