name: Fix stale added unstage
on:
  push:
    branches:
      - feature/git-like-staging
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/git-like-staging
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Apply fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/stagingCoordinator.ts')
          s = p.read_text()
          old = '''    const addedPaths = resources
              .filter(resource => resource.type === Status.ADDED)
              .map(resource => resource.resourceUri.fsPath);
            const addedDirectories =
              metadata.wasUnversioned &&
              metadata.createdDirectoryRelativeRoot &&
              addedPaths.length
                ? await this.addedAncestorDirectoriesForUnstage(
                    repository,
                    addedPaths,
                    metadata.createdDirectoryRelativeRoot
                  )
                : [];

            await repository.removeChangelist(paths);
            if (metadata.wasUnversioned && addedPaths.length) {
              await repository.revert(addedPaths, "empty");
              for (const directory of addedDirectories) {
                await repository.revert([directory], "empty");
              }
            }
          '''
          new = '''    await repository.removeChangelist(paths);
            if (!metadata.wasUnversioned) return;

            const selected = new Set(paths.map(normalizePath));
            const statuses = await repository.repository.getStatus({
              includeIgnored: true,
              includeExternals: false,
              forceFull: true
            });
            const addedPaths = statuses
              .filter(status => status.status === Status.ADDED)
              .map(status =>
                path.isAbsolute(status.path)
                  ? status.path
                  : path.resolve(repository.workspaceRoot, status.path)
              )
              .filter(candidate => selected.has(normalizePath(candidate)));
            if (!addedPaths.length) return;

            const addedDirectories = metadata.createdDirectoryRelativeRoot
              ? await this.addedAncestorDirectoriesForUnstage(
                  repository,
                  addedPaths,
                  metadata.createdDirectoryRelativeRoot
                )
              : [];

            await repository.revert(addedPaths, "empty");
            for (const directory of addedDirectories) {
              await repository.revert([directory], "empty");
            }
          '''
          if old not in s:
              raise SystemExit('stagingCoordinator target block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/test/stagingLiveValidation.test.ts')
          s = p.read_text()
          old = '''    const originalEnsureStatus = repository.ensureStatus.bind(repository);
            (repository as any).ensureStatus = async () => {
              await repository.status();
            };
            try {
              await commands.executeCommand("svn.unstage", staleStaged);
            } finally {
              (repository as any).ensureStatus = originalEnsureStatus;
            }
          '''
          new = '''    await commands.executeCommand("svn.unstage", staleStaged);
          '''
          if old not in s:
              raise SystemExit('live validation target block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          yarn prettier --write src/stagingCoordinator.ts src/test/stagingLiveValidation.test.ts
          yarn check
          yarn test:unit
      - name: Commit and remove helper
        run: |
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git add src/stagingCoordinator.ts src/test/stagingLiveValidation.test.ts
          git commit -m "fix: recheck staged additions before revert"
          git rm .github/workflows/fix-stale-added-unstage.yml
          git commit -m "chore: remove stale-added fix helper"
          git push origin HEAD:feature/git-like-staging
