name: Apply final staging review fixes
on: push
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/git-like-staging
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Apply review fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one match in {path}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/stagingCoordinator.ts",
              '''  public clearInputBoxes(repository: Repository): void {\n    for (const peer of this.repositoriesForWorkingCopy(repository)) {\n      peer.inputBox.value = "";\n    }\n  }\n\n  private attach(repository: Repository): void {''',
              '''  public clearInputBoxes(repository: Repository): void {\n    for (const peer of this.repositoriesForWorkingCopy(repository)) {\n      peer.inputBox.value = "";\n    }\n  }\n\n  public async finalizeCommitted(\n    entries: Array<{ repository: Repository; resource: Resource }>\n  ): Promise<void> {\n    const grouped = new Map<\n      Repository,\n      Map<string | undefined, string[]>\n    >();\n\n    for (const { repository, resource } of entries) {\n      const key = normalizePath(resource.resourceUri.fsPath);\n      const stagingChangelist =\n        this.states.get(repository)?.metadataByPath.get(key) ??\n        repository.stagedChangelists.get(key);\n      if (!stagingChangelist || !isStagingChangelist(stagingChangelist)) {\n        continue;\n      }\n\n      const metadata = parseStagingChangelist(stagingChangelist);\n      if (!metadata) continue;\n\n      const destinations = grouped.get(repository) ?? new Map();\n      const paths = destinations.get(metadata.originalChangelist) ?? [];\n      paths.push(resource.resourceUri.fsPath);\n      destinations.set(metadata.originalChangelist, paths);\n      grouped.set(repository, destinations);\n    }\n\n    for (const [repository, destinations] of grouped) {\n      for (const [destination, paths] of destinations) {\n        if (destination) {\n          await repository.addChangelist(paths, destination);\n        } else {\n          await repository.removeChangelist(paths);\n        }\n      }\n    }\n  }\n\n  private attach(repository: Repository): void {'''
          )

          replace_once(
              "src/stagingCoordinator.ts",
              '''  private reconcile(repository: Repository): void {\n    const state = this.states.get(repository);\n    if (!state) return;\n\n    const staged: Resource[] = [];''',
              '''  private reconcile(repository: Repository): void {\n    const state = this.states.get(repository);\n    if (!state) return;\n\n    repository.changes.repository = repository;\n    repository.conflicts.repository = repository;\n    repository.unversioned.repository = repository;\n    for (const group of repository.changelists.values()) {\n      group.repository = repository;\n    }\n\n    const staged: Resource[] = [];'''
          )

          replace_once(
              "src/commands/commitStaged.ts",
              '''    const result = await anchor.commitFiles(message, commitPaths);\n    window.showInformationMessage(result);''',
              '''    const result = await anchor.commitFiles(message, commitPaths);\n    await staging.finalizeCommitted(entries);\n    window.showInformationMessage(result);'''
          )

          replace_once(
              "src/test/staging.test.ts",
              '''    await repository.addChangelist([file], "personal-work");\n    const userResource = repository.changelists\n      .get("personal-work")\n      ?.resourceStates.find(item => item.resourceUri.fsPath === file);\n    assert.ok(userResource);''',
              '''    await repository.addChangelist([file], "personal-work");\n    const userGroup = repository.changelists.get("personal-work");\n    const userResource = userGroup?.resourceStates.find(\n      item => item.resourceUri.fsPath === file\n    );\n    assert.ok(userResource);\n    assert.equal(repository.unversioned.repository, repository);\n    assert.equal(userGroup?.repository, repository);\n    assert.equal(sourceControlManager.getRepository(userGroup), repository);'''
          )

          replace_once(
              "src/test/staging.test.ts",
              '''    repository.inputBox.value = "sequential staged commit";\n    await commands.executeCommand("svn.commitStaged", repository.sourceControl);\n    assert.equal(svn(["status"], checkout.fsPath).trim(), "");\n  });''',
              '''    repository.inputBox.value = "sequential staged commit";\n    await commands.executeCommand("svn.commitStaged", repository.sourceControl);\n    assert.equal(svn(["status"], checkout.fsPath).trim(), "");\n\n    fs.writeFileSync(fileOne, "a2\\n");\n    await repository.status();\n    assert.equal(\n      repository.staged?.resourceStates.some(\n        item => item.resourceUri.fsPath === fileOne\n      ),\n      false\n    );\n    assert.equal(\n      repository.changes.resourceStates.some(\n        item => item.resourceUri.fsPath === fileOne\n      ),\n      true\n    );\n  });'''
          )

          marker = '''  test("unstaging an unversioned folder restores its scheduled additions", async () => {'''
          p = Path("src/test/staging.test.ts")
          text = p.read_text()
          if text.count(marker) != 1:
              raise SystemExit("Expected unversioned-folder test marker exactly once")
          new_test = '''  test("committed unversioned files leave the staging changelist", async () => {\n    const checkout = await createCheckoutWithFiles();\n    await sourceControlManager.tryOpenRepository(checkout.fsPath);\n    const repository = sourceControlManager.getRepository(\n      checkout\n    ) as Repository;\n    opened.push(repository);\n\n    const file = path.join(checkout.fsPath, "new.txt");\n    fs.writeFileSync(file, "new\\n");\n    await repository.status();\n    const resource = repository.unversioned.resourceStates.find(\n      item => item.resourceUri.fsPath === file\n    );\n    assert.ok(resource);\n\n    await commands.executeCommand("svn.stage", resource);\n    repository.inputBox.value = "commit new staged file";\n    await commands.executeCommand("svn.commitStaged", repository.sourceControl);\n\n    assert.equal(fs.existsSync(file), true);\n    assert.equal(svn(["status"], checkout.fsPath).trim(), "");\n\n    fs.writeFileSync(file, "changed after commit\\n");\n    await repository.status();\n    assert.equal(\n      repository.staged?.resourceStates.some(\n        item => item.resourceUri.fsPath === file\n      ),\n      false\n    );\n    assert.equal(\n      repository.changes.resourceStates.some(\n        item => item.resourceUri.fsPath === file\n      ),\n      true\n    );\n  });\n\n'''
          p.write_text(text.replace(marker, new_test + marker, 1))

          replace_once(
              "docs/staging.md",
              '''The `__svn_scm_staged__` changelist namespace is reserved for extension-owned staging metadata. The reserved name also encodes whether a file came from a user changelist. Unstage can therefore restore the original changelist even after a reload. Files that were unversioned before staging are marked separately so unstage can return them to an uncommitted state.''',
              '''The `__svn_scm_staged__` changelist namespace is reserved for extension-owned staging metadata. The reserved name also encodes whether a file came from a user changelist. Unstage can therefore restore the original changelist even after a reload. Files that were unversioned before staging are marked separately so unstage can return them to an uncommitted state. After a successful staged commit, reserved membership is removed (or the original user changelist is restored) before refresh so later edits never become staged implicitly.'''
          )
      - name: Format and validate
        run: |
          yarn prettier --write src/stagingCoordinator.ts src/commands/commitStaged.ts src/test/staging.test.ts docs/staging.md
          yarn check
          yarn test:unit
      - name: Commit fixes and remove helper
        run: |
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git rm .github/workflows/apply-final-staging-review-fixes.yml
          git add src/stagingCoordinator.ts src/commands/commitStaged.ts src/test/staging.test.ts docs/staging.md
          git commit -m "fix: finalize staging state after commit"
          git push origin HEAD:feature/git-like-staging
