name: Apply staging selection validation

on:
  push:
    paths:
      - .github/workflows/apply-staging-selection-validation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/git-like-staging
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Apply selection validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/stagingCoordinator.ts')
          s = p.read_text()
          marker = '  public async stage(resources: Resource[]): Promise<void> {\n'
          insert = '''  public async validateStageSelection(\n    resources: Resource[]\n  ): Promise<Resource[]> {\n    return this.validateSelection(resources, false);\n  }\n\n  public async validateUnstageSelection(\n    resources: Resource[]\n  ): Promise<Resource[]> {\n    return this.validateSelection(resources, true);\n  }\n\n  private async validateSelection(\n    resources: Resource[],\n    stagedOnly: boolean\n  ): Promise<Resource[]> {\n    const byRepository = new Map<Repository, Resource[]>();\n    for (const resource of uniqueResources(resources)) {\n      const repository = this.sourceControlManager.getRepository(\n        resource.resourceUri\n      );\n      if (!repository) continue;\n      const selected = byRepository.get(repository) ?? [];\n      selected.push(resource);\n      byRepository.set(repository, selected);\n    }\n\n    const validated: Resource[] = [];\n    for (const [repository, selected] of byRepository) {\n      await repository.ensureStatus();\n      const staged = this.states.get(repository)?.group.resourceStates ?? [];\n\n      for (const original of selected) {\n        const filePath = original.resourceUri.fsPath;\n        if (!stagedOnly && repository.isPreviewResource(original)) {\n          try {\n            if ((await lstat(filePath)).isDirectory()) continue;\n          } catch {\n            continue;\n          }\n        }\n\n        const stagedResource = staged.find(resource =>\n          samePath(resource.resourceUri.fsPath, filePath)\n        );\n        if (stagedOnly) {\n          if (stagedResource) validated.push(stagedResource as Resource);\n          continue;\n        }\n        if (stagedResource) continue;\n\n        const current = this.findResource(repository, filePath);\n        if (current && current.type !== Status.CONFLICTED) {\n          validated.push(current);\n        }\n      }\n    }\n\n    return uniqueResources(validated);\n  }\n\n'''
          if marker not in s:
              raise SystemExit('stage marker not found')
          if 'validateStageSelection(' not in s:
              s = s.replace(marker, insert + marker, 1)
          p.write_text(s)
          PY
          yarn prettier --write src/stagingCoordinator.ts src/commands/stage.ts src/commands/commitStaged.ts src/test/stagingLiveValidation.test.ts
          yarn check
      - name: Commit and remove helper
        shell: bash
        run: |
          rm .github/workflows/apply-staging-selection-validation.yml
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git add src/stagingCoordinator.ts src/commands/stage.ts src/commands/commitStaged.ts src/test/stagingLiveValidation.test.ts .github/workflows/apply-staging-selection-validation.yml
          git commit -m "fix: validate live staging membership"
          git push origin HEAD:feature/git-like-staging
