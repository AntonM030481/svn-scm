name: Fix Windows staging folder test

on:
  push:
    branches:
      - fix/windows-staging-folder-test

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/windows-staging-folder-test
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Apply portable assertions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/test/stagingUiArgs.test.ts';
          let text = fs.readFileSync(file, 'utf8');
          const first = 'assert.match(status, /^M\\s+folder\\/first\\.txt$/m);';
          const second = 'assert.match(status, /^M\\s+folder\\/second\\.txt$/m);';
          if (!text.includes(first) || !text.includes(second)) {
            throw new Error('Expected platform-specific assertions not found');
          }
          text = text.replace(first, 'assert.match(status, /^M\\s+folder[\\\\/]first\\.txt$/m);');
          text = text.replace(second, 'assert.match(status, /^M\\s+folder[\\\\/]second\\.txt$/m);');
          fs.writeFileSync(file, text);
          NODE
          yarn check
          yarn test-compile
      - name: Commit and remove helper
        shell: bash
        run: |
          rm .github/workflows/fix-windows-staging-folder-test.yml
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git add src/test/stagingUiArgs.test.ts .github/workflows/fix-windows-staging-folder-test.yml
          git commit -m "test: make staging folder status assertions cross-platform"
          git push origin HEAD:fix/windows-staging-folder-test
