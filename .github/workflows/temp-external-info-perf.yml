name: Temporary external info optimization

on:
  push:
    branches:
      - "perf/skip-unused-external-info"
    paths:
      - ".github/workflows/temp-external-info-perf.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: perf/skip-unused-external-info
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: python .github/temp_patch_external.py
      - run: yarn check
      - run: yarn test:unit
      - run: yarn build
      - name: Commit changes
        run: |
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git add src/svnRepository.ts src/incrementalStatus.ts src/repository.ts src/test/svnRepository.test.ts
          git commit -m "perf: skip unused external repository info"
          git push origin HEAD:perf/skip-unused-external-info
