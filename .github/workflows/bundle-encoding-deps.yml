name: Bundle encoding dependencies

on:
  push:
    branches:
      - chore/bundle-encoding-deps
    paths:
      - .github/workflows/bundle-encoding-deps.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: chore/bundle-encoding-deps

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Replace VS Code internal module loader
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const replacements = [
            ['src/encoding.ts', 'import { jschardet } from "./vscodeModules";', 'import * as jschardet from "jschardet";'],
            ['src/svn.ts', 'import { iconv } from "./vscodeModules";', 'import * as iconv from "@vscode/iconv-lite-umd";'],
            ['src/temp_svn_fs.ts', 'import { iconv } from "./vscodeModules";', 'import * as iconv from "@vscode/iconv-lite-umd";'],
          ];

          for (const [file, from, to] of replacements) {
            let text = fs.readFileSync(file, 'utf8');
            if (!text.includes(from)) throw new Error(`Expected import not found in ${file}`);
            text = text.replace(from, to);
            fs.writeFileSync(file, text);
          }

          fs.rmSync('src/vscodeModules.ts');
          NODE

      - name: Verify no internal VS Code module dependency remains
        shell: bash
        run: |
          if git grep -n 'vscodeModules' -- 'src/**/*.ts'; then
            echo 'Unexpected vscodeModules reference remains'
            exit 1
          fi
          if git grep -n 'env.appRoot.*node_modules' -- 'src/**/*.ts'; then
            echo 'Unexpected VS Code internal node_modules lookup remains'
            exit 1
          fi

      - name: Check
        run: yarn check

      - name: Unit tests
        run: yarn test:unit

      - name: Build
        run: yarn build

      - name: Verify dependencies are bundled
        shell: bash
        run: |
          if grep -Fq 'require("jschardet")' out/extension.js; then
            echo 'jschardet remains external at runtime'
            exit 1
          fi
          if grep -Fq 'require("@vscode/iconv-lite-umd")' out/extension.js; then
            echo '@vscode/iconv-lite-umd remains external at runtime'
            exit 1
          fi

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/encoding.ts src/svn.ts src/temp_svn_fs.ts src/vscodeModules.ts
          git commit -m "refactor: bundle encoding dependencies"
          git push
