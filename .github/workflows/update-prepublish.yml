name: Update prepublish

on:
  push:
    branches:
      - chore/modernize-release-workflow
    paths:
      - .github/workflows/update-prepublish.yml

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/modernize-release-workflow

      - name: Update prepublish script
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'package.json';
          let text = fs.readFileSync(file, 'utf8');
          const from = '"vscode:prepublish": "yarn run lint && yarn run build"';
          const to = '"vscode:prepublish": "yarn check && yarn build"';
          if (!text.includes(from)) throw new Error('Expected prepublish script not found');
          fs.writeFileSync(file, text.replace(from, to));
          NODE

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn test:unit
      - run: yarn vsce package --no-yarn -o svn-scm.vsix

      - name: Commit package.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: unify prepublish checks"
          git push
