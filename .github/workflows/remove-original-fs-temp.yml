name: Remove original-fs temp

on:
  push:
    branches:
      - test/asar-physical-fs
    paths:
      - .github/workflows/remove-original-fs-temp.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/asar-physical-fs
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn remove original-fs
      - run: yarn check
      - run: yarn test:unit
      - run: yarn build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock
          git commit -m "chore: remove original-fs dev dependency"
          git push

# temporary validation workflow; removed before merge
