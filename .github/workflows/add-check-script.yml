name: Add check script

on:
  push:
    branches:
      - ci/unified-check

permissions:
  contents: write

jobs:
  patch-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ci/unified-check

      - name: Add unified check script
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const text = fs.readFileSync(path, 'utf8');
          const marker = '        "build": "webpack --mode production",\n';
          const addition = '        "check": "yarn lint && yarn style-check && yarn test-compile",\n';

          if (!text.includes('"check": "yarn lint && yarn style-check && yarn test-compile"')) {
              if (!text.includes(marker)) {
                  throw new Error('Could not find scripts.build marker in package.json');
              }
              fs.writeFileSync(path, text.replace(marker, marker + addition));
          }
          NODE

          if git diff --quiet -- package.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: add unified check command"
          git push origin HEAD:ci/unified-check
