name: Format startup test

on:
  push:
    branches:
      - test/startup-file-history

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/startup-file-history
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn prettier --write src/test/startupFileHistory.test.ts
      - run: |
          rm .github/workflows/format-startup-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test/startupFileHistory.test.ts .github/workflows/format-startup-test.yml
          git commit -m "style: format startup file history tests"
          git push
