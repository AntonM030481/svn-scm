name: Update iconv runtime dependency

on:
  push:
    branches:
      - chore/modernize-iconv-runtime
    paths:
      - .github/workflows/update-iconv-runtime.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: chore/modernize-iconv-runtime

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Update dependencies
        run: |
          yarn remove iconv-lite-umd
          yarn add -D @vscode/iconv-lite-umd@0.7.1

      - name: Adapt runtime lookup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/vscodeModules.ts")
          text = path.read_text()
          old = '''let iconv_lite = getNodeModule(\n  "iconv-lite-umd",\n  false\n) as typeof import("iconv-lite-umd");\nif (!iconv_lite) {\n  iconv_lite = getNodeModule("iconv-lite") as typeof import("iconv-lite");\n}\nexport const iconv = iconv_lite;'''
          new = '''let iconv_lite = getNodeModule(\n  "@vscode/iconv-lite-umd",\n  false\n) as typeof import("@vscode/iconv-lite-umd");\nif (!iconv_lite) {\n  iconv_lite = getNodeModule(\n    "iconv-lite-umd",\n    false\n  ) as typeof import("@vscode/iconv-lite-umd");\n}\nif (!iconv_lite) {\n  iconv_lite = getNodeModule(\n    "iconv-lite"\n  ) as typeof import("@vscode/iconv-lite-umd");\n}\nexport const iconv = iconv_lite;'''
          if old not in text:
              raise SystemExit("expected iconv lookup block not found")
          path.write_text(text.replace(old, new))
          PY

      - name: Check
        run: yarn check

      - name: Unit tests
        run: yarn test:unit

      - name: Build
        run: yarn build

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock src/vscodeModules.ts
          git commit -m "chore: modernize iconv runtime lookup"
          git push
