name: Apply staging final review fixes 2

on:
  push:
    paths:
      - .github/workflows/apply-staging-final-review-2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/git-like-staging
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --immutable
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path

          package = Path('package.json')
          raw = package.read_bytes()
          old = b'"when": "config.svn.enabled && scmProvider == svn && scmResourceGroup != unversioned && scmResourceGroup != external && scmResourceGroup != conflicts && scmResourceGroup != remotechanges"'
          new = b'"when": "config.svn.enabled && scmProvider == svn && scmResourceGroup != staged && scmResourceGroup != unversioned && scmResourceGroup != external && scmResourceGroup != conflicts && scmResourceGroup != remotechanges"'
          # Apply only to staging-unsafe mutation menu entries, preserving package.json CRLF bytes.
          for command in (b'svn.changelist', b'svn.commit', b'svn.revert', b'svn.remove'):
              pos = 0
              while True:
                  marker = b'"command": "' + command + b'"'
                  start = raw.find(marker, pos)
                  if start < 0:
                      break
                  end = raw.find(b'\n                }', start)
                  if end < 0:
                      raise SystemExit(f'could not locate menu block for {command!r}')
                  block = raw[start:end]
                  if old in block:
                      raw = raw[:start] + block.replace(old, new) + raw[end:]
                      pos = start + len(block) + 1
                  else:
                      pos = end + 1
          package.write_bytes(raw)

          svn_repo = Path('src/svnRepository.ts')
          text = svn_repo.read_text()
          text = text.replace(
              'import { exists, writeFile, stat, readdir } from "./fs";',
              'import { exists, writeFile, stat, lstat, readdir } from "./fs";'
          )
          fn = text.index('  public async addFilesByIgnore(')
          end = text.index('\n  public addFiles(', fn)
          section = text[fn:end]
          expected = 'if ((await stat(file)).isDirectory()) {'
          if expected not in section:
              raise SystemExit('addFilesByIgnore stat classification not found')
          section = section.replace(expected, 'if ((await lstat(file)).isDirectory()) {', 1)
          text = text[:fn] + section + text[end:]
          svn_repo.write_text(text)

          tests = Path('src/test/staging.test.ts')
          text = tests.read_text()
          anchor = '  test("directory-only versioned changes stay unstaged", async () => {'
          if anchor not in text:
              raise SystemExit('test insertion anchor not found')
          test = '''  test("sourceControl.ignore does not dereference staged symlinks", async () => {\n    if (process.platform === "win32") return;\n\n    const checkout = await createCheckoutWithFiles();\n    await sourceControlManager.tryOpenRepository(checkout.fsPath);\n    const repository = sourceControlManager.getRepository(\n      checkout\n    ) as Repository;\n    opened.push(repository);\n\n    const svnConfiguration = workspace.getConfiguration("svn");\n    const previousIgnore = svnConfiguration.inspect<string[]>(\n      "sourceControl.ignore"\n    )?.globalValue;\n    await svnConfiguration.update(\n      "sourceControl.ignore",\n      ["**/*.ignored"],\n      ConfigurationTarget.Global\n    );\n\n    try {\n      const link = path.join(checkout.fsPath, "ignored-path-link");\n      fs.symlinkSync("one", link);\n      await repository.status();\n\n      const resource = repository.unversioned.resourceStates.find(\n        item => item.resourceUri.fsPath === link\n      );\n      assert.ok(resource);\n\n      await commands.executeCommand("svn.stage", resource);\n      assert.equal(\n        repository.staged?.resourceStates.some(\n          item => item.resourceUri.fsPath === link\n        ),\n        true\n      );\n      assert.match(svn(["status"], checkout.fsPath), /^A\\s+ignored-path-link/m);\n    } finally {\n      await svnConfiguration.update(\n        "sourceControl.ignore",\n        previousIgnore,\n        ConfigurationTarget.Global\n      );\n    }\n  });\n\n'''
          text = text.replace(anchor, test + anchor, 1)
          tests.write_text(text)
      - name: Format and validate
        run: |
          yarn prettier --write src/svnRepository.ts src/test/staging.test.ts
          yarn check
          yarn test:unit
      - name: Commit fixes and remove helper
        run: |
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git add package.json src/svnRepository.ts src/test/staging.test.ts
          git rm .github/workflows/apply-staging-final-review-2.yml
          git commit -m "fix: close remaining staging review gaps"
          git push origin HEAD:feature/git-like-staging
