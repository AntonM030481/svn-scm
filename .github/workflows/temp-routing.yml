name: Temporary repository routing optimization

on:
  push:
    branches:
      - "perf/repository-routing"
    paths:
      - ".github/workflows/temp-routing.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: perf/repository-routing
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Use in-memory repository routing
        run: |
          sed -i '/  public async getRepositoryFromUri(uri: Uri): Promise<Repository | null> {/,/  private open(repository: Repository): void {/c\  public async getRepositoryFromUri(uri: Uri): Promise<Repository | null> {\n    const liveRepository = this.getOpenRepository(uri);\n    return liveRepository ? liveRepository.repository : null;\n  }\n\n  private open(repository: Repository): void {' src/source_control_manager.ts
          yarn style-fix
      - run: yarn check
      - run: yarn test:unit
      - run: yarn build
      - name: Commit source change
        run: |
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git add src/source_control_manager.ts
          git commit -m "perf: route repositories without svn info"
          git push origin HEAD:perf/repository-routing
