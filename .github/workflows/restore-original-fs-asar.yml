name: Validate original-fs ASAR compatibility

on:
  push:
    branches:
      - test/asar-physical-fs
    paths:
      - .github/workflows/restore-original-fs-asar.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/asar-physical-fs

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn add -D original-fs@1.2.0

      - name: Restore physical filesystem adapter
        shell: bash
        run: |
          cat > src/fs/physical.ts <<'EOF'
          import * as physicalFs from "original-fs";

          export { physicalFs };
          export const physicalFsPromises = physicalFs.promises;
          EOF

          mkdir -p src/types
          cat > src/types/original-fs.d.ts <<'EOF'
          declare module "original-fs" {
            export * from "fs";
          }
          EOF

          yarn prettier --write src/fs/physical.ts src/types/original-fs.d.ts

      - run: yarn check
      - run: yarn test:unit
      - run: yarn build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock src/fs/physical.ts src/types/original-fs.d.ts
          git commit -m "fix: retain original-fs for ASAR compatibility"
          git push
