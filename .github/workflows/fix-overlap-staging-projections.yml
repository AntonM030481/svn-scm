name: Fix overlapping staging projections
on:
  push:
    branches:
      - feature/git-like-staging
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/git-like-staging
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Apply fix and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/stagingCoordinator.ts')
          s = p.read_text()
          marker = '''  public async stage(resources: Resource[]): Promise<void> {\n'''
          helper = '''  private async refreshProjectionsContainingPaths(\n    repository: Repository,\n    resources: Resource[]\n  ): Promise<void> {\n    const filePaths = resources.map(resource => resource.resourceUri.fsPath);\n    const peers = this.repositoriesForWorkingCopy(repository).filter(peer =>\n      filePaths.some(filePath => isPathInside(peer.workspaceRoot, filePath))\n    );\n    await Promise.all(peers.map(peer => peer.fullStatus()));\n  }\n\n'''
          if marker not in s or 'refreshProjectionsContainingPaths' in s:
              raise SystemExit('staging helper insertion target mismatch')
          s = s.replace(marker, helper + marker, 1)

          old = '''    for (const [repository, selected] of byRepository) {\n      await this.stageInRepository(repository, selected);\n    }\n  }\n\n  public async stageAll'''
          new = '''    for (const [repository, selected] of byRepository) {\n      await this.stageInRepository(repository, selected);\n      await this.refreshProjectionsContainingPaths(repository, selected);\n    }\n  }\n\n  public async stageAll'''
          if old not in s:
              raise SystemExit('stage refresh target mismatch')
          s = s.replace(old, new, 1)

          old = '''      for (const [stagingChangelist, resources] of grouped) {\n        const metadata = parseStagingChangelist(stagingChangelist);\n        if (!metadata) continue;\n        await this.restoreDestination(repository, resources, metadata);\n      }\n    }\n  }\n\n  public async unstageAll'''
          new = '''      for (const [stagingChangelist, resources] of grouped) {\n        const metadata = parseStagingChangelist(stagingChangelist);\n        if (!metadata) continue;\n        await this.restoreDestination(repository, resources, metadata);\n      }\n      await this.refreshProjectionsContainingPaths(repository, selected);\n    }\n  }\n\n  public async unstageAll'''
          if old not in s:
              raise SystemExit('unstage refresh target mismatch')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/test/staging.test.ts')
          s = p.read_text()
          marker = '''  test("one staged commit spans sibling workspace folders in the same WC", async () => {\n'''
          test = '''  test("stage and unstage refresh overlapping projections in one WC", async () => {\n    const checkout = await createCheckoutWithFiles();\n    const childRoot = path.join(checkout.fsPath, "one");\n    const file = path.join(childRoot, "a.txt");\n\n    await sourceControlManager.tryOpenRepository(childRoot);\n    await sourceControlManager.tryOpenRepository(checkout.fsPath);\n\n    const childRepository = sourceControlManager.repositories.find(\n      candidate => path.resolve(candidate.workspaceRoot) === path.resolve(childRoot)\n    );\n    const parentRepository = sourceControlManager.repositories.find(\n      candidate =>\n        path.resolve(candidate.workspaceRoot) === path.resolve(checkout.fsPath)\n    );\n    assert.ok(childRepository);\n    assert.ok(parentRepository);\n    assert.notStrictEqual(childRepository, parentRepository);\n    opened.push(childRepository, parentRepository);\n\n    fs.writeFileSync(file, "overlap edit\\n");\n    await childRepository.fullStatus();\n    await parentRepository.fullStatus();\n\n    const parentResource = parentRepository.changes.resourceStates.find(\n      item => item.resourceUri.fsPath === file\n    );\n    assert.ok(parentResource);\n\n    await commands.executeCommand("svn.stage", parentResource);\n    for (const repository of [childRepository, parentRepository]) {\n      assert.equal(\n        repository.staged?.resourceStates.some(\n          item => item.resourceUri.fsPath === file\n        ),\n        true\n      );\n      assert.equal(\n        repository.changes.resourceStates.some(\n          item => item.resourceUri.fsPath === file\n        ),\n        false\n      );\n    }\n\n    const parentStaged = parentRepository.staged?.resourceStates.find(\n      item => item.resourceUri.fsPath === file\n    );\n    assert.ok(parentStaged);\n    await commands.executeCommand("svn.unstage", parentStaged);\n\n    for (const repository of [childRepository, parentRepository]) {\n      assert.equal(\n        repository.staged?.resourceStates.some(\n          item => item.resourceUri.fsPath === file\n        ),\n        false\n      );\n      assert.equal(\n        repository.changes.resourceStates.some(\n          item => item.resourceUri.fsPath === file\n        ),\n        true\n      );\n    }\n  });\n\n'''
          if marker not in s or 'stage and unstage refresh overlapping projections' in s:
              raise SystemExit('overlap regression insertion target mismatch')
          p.write_text(s.replace(marker, test + marker, 1))
          PY
          yarn prettier --write src/stagingCoordinator.ts src/test/staging.test.ts
          yarn check
          yarn test:unit
      - name: Commit and remove helper
        run: |
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git add src/stagingCoordinator.ts src/test/staging.test.ts
          git commit -m "fix: refresh overlapping staging projections"
          git rm .github/workflows/fix-overlap-staging-projections.yml
          git commit -m "chore: remove overlap staging helper"
          git push origin HEAD:feature/git-like-staging
