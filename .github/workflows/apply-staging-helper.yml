name: Apply staging helper

on:
  push:
    branches:
      - feature/git-like-staging
    paths:
      - .github/workflows/apply-staging-helper.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/git-like-staging
          persist-credentials: true
      - name: Apply manifest edits
        run: node tools/apply-staging-manifest.cjs
      - name: Commit result
        run: |
          rm tools/apply-staging-manifest.cjs
          rm .github/workflows/apply-staging-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json tools/apply-staging-manifest.cjs .github/workflows/apply-staging-helper.yml
          git commit -m "feat: wire staging into SCM menus"
          git push origin HEAD:feature/git-like-staging
