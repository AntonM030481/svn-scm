name: Remove unused dependencies

on:
  push:
    branches:
      - chore/remove-unused-deps
    paths:
      - .github/workflows/remove-unused-deps.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: chore/remove-unused-deps

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Verify decache is unused
        shell: bash
        run: |
          refs=$(git grep -n 'decache' -- ':!package.json' ':!yarn.lock' ':!.github/workflows/remove-unused-deps.yml' || true)
          if [ -n "$refs" ]; then
            echo "$refs"
            exit 1
          fi

      - name: Remove dependency
        run: yarn remove decache

      - name: Check
        run: yarn check

      - name: Unit tests
        run: yarn test:unit

      - name: Build
        run: yarn build

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock
          git commit -m "chore: remove unused decache dependency"
          git push
