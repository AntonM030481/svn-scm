name: Temporary activation lifecycle cleanup

on:
  push:
    branches:
      - "fix/activation-disposables"
    paths:
      - ".github/workflows/temp-activation-disposables.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/activation-disposables
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Track activation disposables
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path('src/helpers/configuration.ts')
          text = config.read_text()
          text = text.replace(
              '  ConfigurationTarget,\n  Event,',
              '  ConfigurationTarget,\n  Disposable,\n  Event,',
              1,
          )
          text = text.replace(
              'class Configuration {\n  private configuration: WorkspaceConfiguration;\n  private _onDidChange = new EventEmitter<ConfigurationChangeEvent>();',
              'class Configuration implements Disposable {\n  private configuration: WorkspaceConfiguration;\n  private _onDidChange = new EventEmitter<ConfigurationChangeEvent>();\n  private readonly configurationChangeDisposable: Disposable;',
              1,
          )
          text = text.replace(
              '    this.configuration = workspace.getConfiguration(SVN);\n    workspace.onDidChangeConfiguration(this.onConfigurationChanged, this);',
              '    this.configuration = workspace.getConfiguration(SVN);\n    this.configurationChangeDisposable = workspace.onDidChangeConfiguration(\n      this.onConfigurationChanged,\n      this\n    );',
              1,
          )
          marker = '''  public inspect(section: string) {
              return this.configuration.inspect(section);
            }
          }'''
          replacement = '''  public inspect(section: string) {
              return this.configuration.inspect(section);
            }

            public dispose(): void {
              this.configurationChangeDisposable.dispose();
              this._onDidChange.dispose();
            }
          }'''
          if marker not in text:
              raise SystemExit('configuration class end not found')
          config.write_text(text.replace(marker, replacement, 1))

          extension = Path('src/extension.ts')
          text = extension.read_text()
          old = '''  const outputChannel = window.createOutputChannel("Svn");
            commands.registerCommand("svn.showOutput", () => outputChannel.show());
            disposables.push(outputChannel);'''
          new = '''  const outputChannel = window.createOutputChannel("Svn");
            disposables.push(
              commands.registerCommand("svn.showOutput", () => outputChannel.show()),
              outputChannel,
              configuration
            );'''
          if old not in text:
              raise SystemExit('extension activation block not found')
          extension.write_text(text.replace(old, new, 1))
          PY
          yarn style-fix
      - run: yarn check
      - run: yarn test:unit
      - run: yarn build
      - name: Commit changes
        run: |
          git config user.name "Anton Makouski"
          git config user.email "85622715+AntonM030481@users.noreply.github.com"
          git add src/helpers/configuration.ts src/extension.ts
          git commit -m "fix: dispose activation resources"
          git push origin HEAD:fix/activation-disposables
