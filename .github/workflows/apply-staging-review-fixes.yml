name: Apply staging review fixes

on:
  push:
    branches:
      - feature/git-like-staging
    paths:
      - .github/workflows/apply-staging-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/git-like-staging
          persist-credentials: true
      - name: Apply fixes
        run: node tools/fix-staging-review.cjs
      - name: Commit result
        run: |
          rm tools/fix-staging-review.cjs
          rm .github/workflows/apply-staging-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/repository.ts src/stagingCoordinator.ts src/test/staging.test.ts tools/fix-staging-review.cjs .github/workflows/apply-staging-review-fixes.yml
          git commit -m "fix: keep staged resources routable"
          git push origin HEAD:feature/git-like-staging
