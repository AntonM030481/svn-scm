name: Update legacy runtime dependencies

on:
  push:
    branches:
      - chore/update-legacy-runtime-deps
    paths:
      - .github/workflows/update-legacy-runtime-deps.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: chore/update-legacy-runtime-deps

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Update dependencies
        run: yarn add -D xml2js@0.6.2 chardet@2.2.0 jschardet@3.1.4

      - name: Check
        run: yarn check

      - name: Unit tests
        run: yarn test:unit

      - name: Build
        run: yarn build

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock
          git commit -m "chore: update legacy runtime dependencies"
          git push
